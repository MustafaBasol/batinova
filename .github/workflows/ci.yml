name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Throwaway MariaDB (Hostinger MySQL is MariaDB-compatible). Test helpers only touch databases named *test*.
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://root:ci-root-throwaway@127.0.0.1:3306/batinova_vitest_test
      E2E_DATABASE_URL: mysql://root:ci-root-throwaway@127.0.0.1:3306/batinova_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SITE_URL: https://btnv.fr
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
  # Hostinger installs production dependencies only: prove build:hostinger's tooling exists in that mode.
  # No database service and no secrets: deploy:setup must stop at its env validation before any DB access.
  prod-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
        env:
          NODE_ENV: production
      - run: node scripts/verify-prod-deps.mjs
        env:
          NODE_ENV: production
      - run: npx next build
        env:
          NODE_ENV: production
          SITE_URL: https://btnv.fr
